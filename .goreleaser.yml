version: 2

project_name: agentfiles

before:
    hooks:
        - go mod tidy

builds:
    - main: ./cmd/af
      binary: af
      env:
          - CGO_ENABLED=0
      goos:
          - linux
          - darwin
      goarch:
          - amd64
          - arm64
      ldflags:
          - -s -w
          - -X main.version={{.Version}}
          - -X main.commit={{.Commit}}
          - -X main.date={{.Date}}

archives:
    - format: tar.gz
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
    name_template: checksums.txt

changelog:
    sort: asc
    filters:
        exclude:
            - "^docs:"
            - "^test:"
            - "^chore:"

brews:
    - repository:
          owner: agentfiles
          name: homebrew-tap
      homepage: https://github.com/agentfiles/agentfiles
      description: Unified configuration layer for AI coding agents
      license: MIT
      install: |
          bin.install "af"
      test: |
          system "#{bin}/af", "--version"
